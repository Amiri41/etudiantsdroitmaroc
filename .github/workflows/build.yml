name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-key.json"

      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: npx firebase-tools deploy --only firestore:rules --project etudiants-droit-maroc --non-interactive

  build:
    runs-on: ubuntu-latest
    needs: deploy-rules

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        id: build
        continue-on-error: true
        run: gradle assembleDebug --stacktrace > build_output.log 2>&1

      - name: Show Kotlin compiler errors
        if: always()
        run: |
          grep -n "^e: " build_output.log | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "::error::البناء فشل - شوف الأخطاء فوق"
            exit 1
          fi

      - name: Upload APK
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: etudiants-droit-maroc-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  build-release:
    runs-on: ubuntu-latest
    needs: deploy-rules
    if: ${{ vars.RELEASE_SIGNING_READY == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Decode release keystore
        run: echo '${{ secrets.RELEASE_KEYSTORE_BASE64 }}' | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed Release APK + AAB
        id: build_release
        continue-on-error: true
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace > build_release_output.log 2>&1

      - name: Show Kotlin compiler errors
        if: always()
        run: |
          grep -nE "^e: |error:|FAILURE|What went wrong|Exception" build_release_output.log | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          if [ "${{ steps.build_release.outcome }}" = "failure" ]; then
            echo "::error::بناء النسخة الموقعة فشل - شوف الأخطاء فوق"
            exit 1
          fi

      - name: Upload Release APK
        if: always() && steps.build_release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: etudiants-droit-maroc-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB (Play Store)
        if: always() && steps.build_release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: etudiants-droit-maroc-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

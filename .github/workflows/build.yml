name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        id: build
        continue-on-error: true
        run: gradle assembleDebug --stacktrace > build_output.log 2>&1

      - name: Show Kotlin compiler errors
        if: always()
        run: |
          grep -n "^e: " build_output.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "::error::البناء فشل - شوف الأخطاء فوق"
            exit 1
          fi

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: etudiants-droit-maroc-debug
          path: app/build/outputs/apk/debug/app-debug.apk

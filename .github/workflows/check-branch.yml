name: Check branch (debug build only)

# يبني النسخة Debug فقط للفروع غير main (بلا نشر قواعد وبلا Release) ويرفع الـ APK كـ artifact
on:
  push:
    branches-ignore: [ main ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        id: build
        continue-on-error: true
        run: gradle assembleDebug --stacktrace > build_output.log 2>&1

      - name: Show compiler and resource errors
        if: always()
        run: |
          grep -nE "^e: |error:|AAPT: error|What went wrong" build_output.log | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            tail -n 40 build_output.log
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: etudiants-droit-maroc-debug-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/*.apk
